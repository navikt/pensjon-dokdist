name: Build, push, and deploy

on:
  push:
  workflow_dispatch:

jobs:

  build:
    name: Build and push Docker container
    permissions:
      contents: read
      checks: write
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build frontend assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@navikt'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run build
      - name: Cache test runner browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install e2e test runner and browser
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install system deps for cached test runner browser
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload e2e artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-artifacts
          path: e2e/e2e-report/
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLEKEY }}
      - name: Build with Gradle
        run: ./gradlew build
      - name: "Build and publish container image"
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        id: docker-build-push
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          team: pensjonsbrev
          image_suffix: pensjon-dokdist
          salsa: false

  deploy-q2:
    name: Deploy to q2
    permissions:
      contents: read
      id-token: write
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/naiserator-q2.yml
          VAR: image=${{ needs.build.outputs.image }}


  deploy-prod:
    name: Deploy to prod
    permissions:
      contents: read
      id-token: write
    needs: build
    if: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: nais/naiserator-prod.yml
          VAR: image=${{ needs.build.outputs.image }}

  salsa:
    name: Generate SBOM, attest and sign image
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: "write"
    steps:
      - name: NAIS login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        id: login
        with:
          team: pensjonsbrev
      - name: Generate SBOM, attest and sign image
        id: attest-sign
        uses: nais/attest-sign@65d1aaa8b7dc5913ae02b80f16f7c1cf9bad6491 # v2.0.17
        with:
          image_ref: ${{ needs.build.outputs.image }}